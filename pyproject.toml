[project]
name = "sentinel"
version = "0.1.0"
description = "Trade event anomaly detection pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
]

[tool.ty.environment]
python = ".venv"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
